name: Build GitHub Pages
on:
  push:
    branches:
      - main
  workflow_dispatch:
  pull_request:
permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '22'
          cache: yarn
      # Yarn 4 is pinned in package.json's `packageManager` field.
      - run: corepack enable
      - run: yarn install --immutable
      - name: Type check
        run: yarn check
      - name: Build
        run: yarn build
      - name: Verify build output
        run: node test/verify-build.mjs
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/configure-pages@v6
      - id: deployment
        uses: actions/deploy-pages@v5
