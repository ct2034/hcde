
name: Linter

on:
  push:
      branches: [ "main" ]
  pull_request:

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:
jobs:
  build:
    name: Pre-commit checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      TZ: Europe/Berlin

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: "22" # cspell needs this
      - run: pip install pre-commit
      - name: Pre-commit
        run: pre-commit run -a
        env:
          # Needs bibtexparser and network access; run it locally instead.
          SKIP: check-get-lit
